<style>
:root{--bg:#f4f6f9;--card:#fff;--txt:#16202a;--muted:#667085;--line:#dfe3e8;--accent:#17365d;--soft:#edf1f6;--good:#147a4a;--warn:#9a6700;--bad:#b42318;--info:#1769aa;--shadow:0 7px 22px rgba(16,24,40,.08)}
[data-theme=dark]{--bg:#0e141b;--card:#171f29;--txt:#edf2f7;--muted:#a2adbb;--line:#303b48;--accent:#7aafe5;--soft:#263240;--good:#68ce9b;--warn:#f0b85b;--bad:#ff8a80;--info:#70baf0;--shadow:0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:#17365d;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header select,header button{background:#fff;color:#18212b;border:0}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:10px;background:#fff;color:#17365d;display:grid;place-items:center;font-weight:900}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8}
button,select,input,textarea{font:inherit}button{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;background:var(--soft);color:var(--txt)}button.primary{background:#17365d;color:#fff}button.goodbtn{background:#147a4a;color:#fff}button.danger{background:#b42318;color:#fff}button.ghost{background:transparent;border:1px solid var(--line);color:inherit}
nav button{background:var(--soft)}nav button.active{background:#17365d;color:#fff}
main{padding:18px;max-width:1580px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}.kpi b{font-size:23px;display:block;margin-top:6px}.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:8px;border:1px solid var(--line);font-size:12.5px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--soft) 80%,transparent);color:var(--muted);font-size:12px}
input,select,textarea{width:100%;padding:7px;border:1px solid #cbd1d8;border-radius:5px;background:var(--card);color:var(--txt)}textarea{min-height:90px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tag,.badge{padding:3px 7px;border-radius:99px;background:var(--soft);font-size:11px;display:inline-block}.good{color:var(--good)}.warning{color:var(--warn)}.dangerText{color:var(--bad)}.info{color:var(--info)}
.rec{padding:10px 12px;border-left:4px solid var(--info);background:color-mix(in srgb,var(--info) 8%,transparent);border-radius:8px;margin:8px 0}.rec.good{border-color:var(--good)}.rec.warning{border-color:var(--warn)}
.plan{position:relative;min-height:460px;border:2px solid var(--line);border-radius:10px;background-image:linear-gradient(rgba(127,127,127,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(127,127,127,.08) 1px,transparent 1px);background-size:50px 50px;background-position:center;background-repeat:repeat;overflow:hidden}
.plan.hasimg{background-size:contain;background-repeat:no-repeat;background-position:center}.zone{position:absolute;border:2px solid #2f5597;background:rgba(47,85,151,.15);border-radius:8px;padding:6px;font-size:11px;overflow:hidden;min-width:42px;min-height:30px}.zone.site{border-color:#147a4a;background:rgba(20,122,74,.12)}
.gantt{min-width:640px}.ganttbar{height:20px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}.ganttbar span{position:absolute;height:100%;background:#667085;border-radius:4px}
.abcbar{height:18px;background:var(--soft);border-radius:4px;overflow:hidden}.abcbar span{display:block;height:100%;background:#667085}.tablewrap{overflow:auto}.grouphead td{font-weight:700;background:color-mix(in srgb,var(--soft) 70%,transparent)}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.48);display:grid;place-items:center;z-index:30;padding:18px}.modal{width:min(860px,96vw);max-height:92vh;overflow:auto;background:var(--card);border-radius:12px;border:1px solid var(--line);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.modal h2{margin-top:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid .full{grid-column:1/-1}
.login{max-width:420px;margin:10vh auto}.hidden{display:none!important}.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.source-pill{white-space:nowrap}.mini{font-size:11px}.nowrap{white-space:nowrap}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}header{padding:12px}nav{overflow:auto;flex-wrap:nowrap}nav button{min-width:max-content}main{padding:12px}}
</style>
</head>

function deep(x){return JSON.parse(JSON.stringify(x))}
function migrate(){
 let found=null;
 try{found=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
 if(found)return found;
 for(const k of LEGACY_KEYS){try{const old=JSON.parse(localStorage.getItem(k)||"null");if(old){found=old;break}}catch(e){}}
 if(!found)return deep(seed);
 const out=deep(seed);
 if(found.users)out.users=found.users;
 if(found.theme)out.theme=found.theme;
 if(found.projects&&found.projects.length){
   const old=found.projects.find(x=>x.id==="sta-terezinha")||found.projects[0];
   const base=deep(model);
   ["name","owner","location","zones","site","planImage","comments","audit"].forEach(k=>{if(old&&old[k]!=null)base[k]=old[k]});
   out.projects=[base,...found.projects.filter(x=>x.id!=="sta-terezinha")];
   out.current=found.current&&out.projects.some(x=>x.id===found.current)?found.current:"sta-terezinha";
 }
 return out;
}

function budgetTotal(){return project().budgetItems.reduce((s,x)=>s+Number(x.qty||0)*Number(x.unitPrice||0),0)}
function baselineExpected(){return 206.29*project().areaParam}
function score(k){return project().criteria.reduce((a,c)=>a+Number(c.w)*(Number(c.s[k]||0))/5,0)}
function winner(){return [...project().systems].sort((a,b)=>score(b.key)-score(a.key))[0]}
function sourceName(id){return project().sources.find(x=>x.id===id)?.name||"—"}function supplierName(id){return project().suppliers.find(x=>x.id===id)?.name||"—"}
function groupName(front,id){return project().groups[front]?.find(x=>x.id===id)?.name||"Sem grupo"}
function quotesFor(itemId,type){return project().quotes.filter(q=>q.budgetItemId===itemId&&(!type||project().sources.find(s=>s.id===q.sourceId)?.type===type)&&q.price!=null)}
function avgQuote(itemId,type){const q=quotesFor(itemId,type);return q.length?q.reduce((s,x)=>s+Number(x.price),0)/q.length:null}
function quoteN(itemId,type){return quotesFor(itemId,type).length}
function systemCost(key){return project().systems.find(x=>x.key===key)?.cost||0}

function recs(){
 const q=project(),r=[],sum=q.criteria.reduce((a,c)=>a+Number(c.w),0),w=winner();
 Math.abs(budgetTotal()-baselineExpected())<.05?r.push(["good","Orçamento-base reproduz a Entrega 1: "+money(budgetTotal())+" para "+q.areaParam+" m² ("+money(budgetTotal()/q.areaParam)+"/m²)."]):r.push(["warning","Orçamento atual diverge da baseline da Entrega 1 em "+money(budgetTotal()-baselineExpected())+"."]);
 sum===100?r.push(["good","Pesos da matriz totalizam 100%."]):r.push(["warning","Pesos da matriz totalizam "+sum+"%; ajuste para 100%."]);
 w.key===q.selected?r.push(["good","Sistema selecionado coincide com a maior nota: "+w.name+" ("+score(w.key).toFixed(1)+"/100)."]):r.push(["warning","Sistema selecionado não é o primeiro da matriz. Atual: "+w.name+"."]);
 const ungrouped=q.budgetItems.filter(x=>!x.groupId).length+q.activities.filter(x=>!x.groupId).length+q.supplies.filter(x=>!x.groupId).length;
 if(ungrouped)r.push(["warning",ungrouped+" registro(s) sem agrupamento visual."]);
 const noSource=q.budgetItems.filter(x=>!x.sourceId).length;if(noSource)r.push(["warning",noSource+" item(ns) orçamentário(s) sem fonte principal."]);
 q.supplies.forEach(s=>{if(s.status!=="Recebido"&&s.lead>5)r.push(["info","Suprimento "+s.name+" possui lead time de "+s.lead+" dias; conferir folga no cronograma."])});
 if(q.selected==="EPS"&&!q.site.epsProtected)r.push(["warning","EPS selecionado sem armazenamento protegido cadastrado."]);
 if(q.selected==="EPS"&&!q.site.firePlan)r.push(["warning","EPS selecionado sem controle de proteção/incêndio cadastrado."]);
 return r;
}
function selfTest(){
 const q=project(),errors=[];
 if(VERSION!=="0.4.0")errors.push("Versão incorreta");
 if(Math.abs(systemCost("EPS")-206.29)>.001)errors.push("Custo EPS divergente");
 if(Math.abs(systemCost("CER")-202.39)>.001)errors.push("Custo cerâmica divergente");
 if(Math.abs(systemCost("NER")-230.62)>.001)errors.push("Custo nervurada divergente");
 if(Math.abs(systemCost("MAC")-263.19)>.001)errors.push("Custo maciça divergente");
 if(Math.abs(score("EPS")-84.6)>.01||Math.abs(score("CER")-83.6)>.01||Math.abs(score("NER")-72.2)>.01||Math.abs(score("MAC")-63)>.01)errors.push("Matriz divergente");
 if(Math.abs(budgetTotal()-48478.15)>.05)errors.push("Orçamento base não fecha R$ 48.478,15");
 ["SINAPI_NAT","SINAPI_DF","SICRO_NAT","SICRO_DF","MARKET_NAT","MARKET_DF","SUPPLIER","BASELINE"].forEach(t=>{if(!q.sources.some(s=>s.type===t)&&t!=="SUPPLIER")errors.push("Fonte ausente: "+t)});
 return errors;
}

function scheduleCalc(){const acts=project().activities,out={};acts.forEach(a=>{const pe=a.pred&&out[a.pred]?out[a.pred].end:0;const start=pe+Number(a.lead||0);out[a.id]={start,end:start+Number(a.days||0)};});return out}
function miniGantt(){const s=scheduleCalc(),max=Math.max(1,...Object.values(s).map(x=>x.end));return '<div class="tablewrap"><table class="gantt"><tr><th>Atividade</th><th>Duração</th><th>Linha do tempo</th></tr>'+project().activities.slice(0,8).map(a=>'<tr><td>'+esc(a.name)+'</td><td>'+num(a.days,2)+' d</td><td><div class="ganttbar"><span style="left:'+(s[a.id].start/max*100)+'%;width:'+Math.max(1,(a.days/max*100))+'%"></span></div></td></tr>').join("")+'</table></div>'}
function ganttView(){const s=scheduleCalc(),max=Math.max(1,...Object.values(s).map(x=>x.end));return '<div class="card"><h2>Cronograma / Gantt</h2><div class="tablewrap"><table class="gantt"><tr><th>ID</th><th>Atividade</th><th>Início</th><th>Fim</th><th>Duração</th><th>Equipe</th><th>Linha do tempo</th></tr>'+project().activities.map(a=>'<tr><td>'+esc(a.id)+'</td><td>'+esc(a.name)+'</td><td>'+num(s[a.id].start,2)+'</td><td>'+num(s[a.id].end,2)+'</td><td>'+num(a.days,2)+' d</td><td>'+a.crew+'</td><td><div class="ganttbar"><span style="left:'+(s[a.id].start/max*100)+'%;width:'+Math.max(1,(a.days/max*100))+'%"></span></div></td></tr>').join("")+'</table></div><p class="muted">Modelo acadêmico: cura/liberação final permanece condicionada ao projeto e à resistência do concreto.</p></div>'}

function openModal(title,body,saveJs){modalRoot.innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="split"><h2>'+esc(title)+'</h2><button onclick="closeModal()">✕</button></div>'+body+'<div class="actions"><button class="primary" onclick="'+saveJs+'">Salvar</button><button onclick="closeModal()">Cancelar</button></div></div></div>'}

function budgetForm(recId){const q=project(),x=q.budgetItems.find(r=>r.id===recId)||{id:"",groupId:q.groups.budget[0]?.id||"",kind:"Material",code:"",name:"",qty:0,unit:"un",unitPrice:0,sourceId:"",supplierId:""};openModal(recId?"Editar item orçamentário":"Novo item orçamentário",'<div class="formgrid">'+field("fId","ID",x.id||id("B"))+selectField("fGroup","Grupo",q.groups.budget.map(g=>[g.id,g.name]),x.groupId)+selectField("fKind","Classe",[["Material","Material"],["Serviço","Serviço"],["Mão de obra","Mão de obra"],["Consumível","Consumível"],["Equipamento","Equipamento"]],x.kind)+field("fCode","Código",x.code)+field("fName","Descrição",x.name,"text","full")+field("fQty","Quantidade",x.qty,"number")+field("fUnit","Unidade",x.unit)+field("fPU","Preço unitário",x.unitPrice,"number")+selectField("fSource","Fonte principal",q.sources.map(s=>[s.id,s.name]),x.sourceId)+selectField("fSupplier","Fornecedor",q.suppliers.map(s=>[s.id,s.name]),x.supplierId)+'</div>','saveBudget(\''+(recId||"")+'\')')}
function saveBudget(recId){const q=project(),obj={id:fId.value.trim()||id("B"),groupId:fGroup.value,kind:fKind.value,code:fCode.value.trim(),name:fName.value.trim(),qty:Number(fQty.value),unit:fUnit.value.trim(),unitPrice:Number(fPU.value),sourceId:fSource.value,supplierId:fSupplier.value,baseline:false};if(!obj.name)return alert("Informe a descrição.");if(recId){const i=q.budgetItems.findIndex(x=>x.id===recId);q.budgetItems[i]={...q.budgetItems[i],...obj}}else q.budgetItems.push(obj);closeModal();persist("Item orçamentário "+(recId?"alterado":"incluído"))}

function activityForm(recId){const q=project(),x=q.activities.find(r=>r.id===recId)||{id:"",groupId:q.groups.planning[0]?.id||"",name:"",zone:"Z1",pred:"",days:1,crew:1,lead:0,status:"Planejada"};openModal(recId?"Editar atividade":"Nova atividade",'<div class="formgrid">'+field("fId","ID",x.id||id("A"))+selectField("fGroup","Grupo",q.groups.planning.map(g=>[g.id,g.name]),x.groupId)+field("fName","Atividade",x.name,"text","full")+selectField("fZone","Zona",q.zones.map(z=>[z.id,z.id+" — "+z.name]),x.zone)+selectField("fPred","Predecessora",[["","Nenhuma"],...q.activities.filter(a=>a.id!==recId).map(a=>[a.id,a.id+" — "+a.name])],x.pred)+field("fDays","Duração (dias)",x.days,"number")+field("fCrew","Equipe",x.crew,"number")+field("fLead","Lead/restrição (dias)",x.lead,"number")+selectField("fStatus","Status",[["Planejada","Planejada"],["Em andamento","Em andamento"],["Concluída","Concluída"],["Bloqueada","Bloqueada"]],x.status)+'</div>','saveActivity(\''+(recId||"")+'\')')}
function saveActivity(recId){const q=project(),obj={id:fId.value.trim()||id("A"),groupId:fGroup.value,name:fName.value.trim(),zone:fZone.value,pred:fPred.value,days:Number(fDays.value),crew:Number(fCrew.value),lead:Number(fLead.value),status:fStatus.value};if(!obj.name)return alert("Informe a atividade.");if(recId){const i=q.activities.findIndex(x=>x.id===recId);q.activities[i]={...q.activities[i],...obj}}else q.activities.push(obj);closeModal();persist("Atividade "+(recId?"alterada":"incluída"))}

function saveSupply(recId){const q=project(),obj={id:fId.value.trim()||id("S"),groupId:fGroup.value,budgetItemId:fBudget.value,name:fName.value.trim(),qty:Number(fQty.value),unit:fUnit.value.trim(),safety:Number(fSafety.value),lead:Number(fLead.value),supplierId:fSupplier.value,status:fStatus.value};if(!obj.name)return alert("Informe o suprimento.");if(recId){const i=q.supplies.findIndex(x=>x.id===recId);q.supplies[i]={...q.supplies[i],...obj}}else q.supplies.push(obj);closeModal();persist("Suprimento "+(recId?"alterado":"incluído"))}

function saveSource(recId){const q=project(),obj={id:fId.value.trim()||id("SRC-"),groupId:fGroup.value,type:fType.value,name:fName.value.trim(),region:fRegion.value.trim(),date:fDate.value.trim(),url:fUrl.value.trim(),note:fNote.value.trim()};if(!obj.name)return alert("Informe o nome.");if(recId){const i=q.sources.findIndex(x=>x.id===recId);q.sources[i]={...q.sources[i],...obj}}else q.sources.push(obj);closeModal();persist("Fonte "+(recId?"alterada":"incluída"))}

function quoteForm(recId){const q=project(),x=q.quotes.find(r=>r.id===recId)||{id:"",budgetItemId:q.budgetItems[0]?.id||"",sourceId:q.sources[0]?.id||"",supplierId:"",price:null,unit:q.budgetItems[0]?.unit||"un",date:"2026-10-01",region:"",url:"",note:""};openModal(recId?"Editar cotação":"Nova cotação / preço",'<div class="formgrid">'+field("fId","ID",x.id||id("Q"))+selectField("fBudget","Item",q.budgetItems.map(b=>[b.id,b.id+" — "+b.name]),x.budgetItemId)+selectField("fSource","Fonte",q.sources.map(s=>[s.id,s.name]),x.sourceId)+selectField("fSupplier","Fornecedor",q.suppliers.map(s=>[s.id,s.name]),x.supplierId)+field("fPrice","Preço (vazio = sob consulta)",x.price==null?"":x.price,"number")+field("fUnit","Unidade",x.unit)+field("fDate","Data",x.date)+field("fRegion","Região",x.region)+field("fUrl","URL",x.url,"text","full")+field("fNote","Observação",x.note,"text","full")+'</div>','saveQuote(\''+(recId||"")+'\')')}
function saveQuote(recId){const q=project(),obj={id:fId.value.trim()||id("Q"),budgetItemId:fBudget.value,sourceId:fSource.value,supplierId:fSupplier.value,price:fPrice.value===""?null:Number(fPrice.value),unit:fUnit.value.trim(),date:fDate.value.trim(),region:fRegion.value.trim(),url:fUrl.value.trim(),note:fNote.value.trim()};if(recId){const i=q.quotes.findIndex(x=>x.id===recId);q.quotes[i]={...q.quotes[i],...obj}}else q.quotes.push(obj);closeModal();persist("Cotação "+(recId?"alterada":"incluída"))}

function supplierForm(recId){const q=project(),x=q.suppliers.find(r=>r.id===recId)||{id:"",groupId:q.groups.suppliers[0]?.id||"",name:"",cnpj:"",city:"",address:"",phone:"",url:"",categories:"",status:""};openModal(recId?"Editar fornecedor":"Novo fornecedor",'<div class="formgrid">'+field("fId","ID",x.id||id("SUP-"))+selectField("fGroup","Grupo",q.groups.suppliers.map(g=>[g.id,g.name]),x.groupId)+field("fName","Fornecedor",x.name,"text","full")+field("fCnpj","CNPJ",x.cnpj)+field("fCity","Cidade/UF",x.city)+field("fAddress","Endereço",x.address,"text","full")+field("fPhone","Contato",x.phone)+field("fUrl","URL",x.url)+field("fCategories","Categorias",x.categories,"text","full")+field("fStatus","Status / observação",x.status,"text","full")+'</div>','saveSupplier(\''+(recId||"")+'\')')}
function saveSupplier(recId){const q=project(),obj={id:fId.value.trim()||id("SUP-"),groupId:fGroup.value,name:fName.value.trim(),cnpj:fCnpj.value.trim(),city:fCity.value.trim(),address:fAddress.value.trim(),phone:fPhone.value.trim(),url:fUrl.value.trim(),categories:fCategories.value.trim(),status:fStatus.value.trim()};if(!obj.name)return alert("Informe o fornecedor.");if(recId){const i=q.suppliers.findIndex(x=>x.id===recId);q.suppliers[i]={...q.suppliers[i],...obj}}else q.suppliers.push(obj);closeModal();persist("Fornecedor "+(recId?"alterado":"incluído"))}

function zoneForm(recId){const q=project(),x=q.zones.find(r=>r.id===recId)||{id:"",name:"",span:4.93,load:3,area:0,sys:"EPS",x:10,y:10,w:20,h:20,note:""};openModal(recId?"Editar zona":"Nova zona",'<div class="formgrid">'+field("fId","ID",x.id||id("Z"))+field("fName","Nome",x.name)+field("fSpan","Vão (m)",x.span,"number")+field("fLoad","Carga variável preliminar (kN/m²)",x.load,"number")+field("fArea","Área paramétrica (m²)",x.area,"number")+selectField("fSys","Sistema",q.systems.map(s=>[s.key,s.name]),x.sys)+field("fX","X (%)",x.x,"number")+field("fY","Y (%)",x.y,"number")+field("fW","Largura (%)",x.w,"number")+field("fH","Altura (%)",x.h,"number")+field("fNote","Observação",x.note,"text","full")+'</div>','saveZone(\''+(recId||"")+'\')')}
function saveZone(recId){const q=project(),obj={id:fId.value.trim()||id("Z"),name:fName.value.trim(),span:Number(fSpan.value),load:Number(fLoad.value),area:Number(fArea.value),sys:fSys.value,x:Number(fX.value),y:Number(fY.value),w:Number(fW.value),h:Number(fH.value),note:fNote.value.trim()};if(!obj.name)return alert("Informe a zona.");if(recId){const i=q.zones.findIndex(x=>x.id===recId);q.zones[i]={...q.zones[i],...obj}}else q.zones.push(obj);closeModal();persist("Zona "+(recId?"alterada":"incluída"))}
function deleteZone(zid){if(!confirm("Excluir a zona "+zid+"? Atividades vinculadas não serão excluídas."))return;project().zones=project().zones.filter(x=>x.id!==zid);persist("Zona excluída: "+zid)}
function loadPlanImage(){const f=planFile.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{project().planImage=r.result;persist("Imagem-base da planta atualizada")};r.readAsDataURL(f)}
function qPlanClear(){project().planImage=null;persist("Imagem-base removida")}

function riskForm(recId){const q=project(),x=q.risks.find(r=>r.id===recId)||{id:"",name:"",p:1,i:1,action:""};openModal(recId?"Editar risco":"Novo risco",'<div class="formgrid">'+field("fId","ID",x.id||id("R"))+field("fName","Risco",x.name,"text","full")+field("fP","Probabilidade 1-5",x.p,"number")+field("fI","Impacto 1-5",x.i,"number")+field("fAction","Resposta / mitigação",x.action,"text","full")+'</div>','saveRisk(\''+(recId||"")+'\')')}
function saveRisk(recId){const q=project(),obj={id:fId.value.trim()||id("R"),name:fName.value.trim(),p:Number(fP.value),i:Number(fI.value),action:fAction.value.trim()};if(recId){const i=q.risks.findIndex(x=>x.id===recId);q.risks[i]=obj}else q.risks.push(obj);closeModal();persist("Risco "+(recId?"alterado":"incluído"))}

function manageGroups(front){const q=project(),arr=q.groups[front]||[];openModal("Agrupamentos — "+front,'<div id="groupRows">'+arr.map((g,i)=>'<div class="card"><div class="formgrid">'+field("gName"+i,"Nome",g.name)+field("gOrder"+i,"Ordem",g.order,"number")+'</div><button class="danger" onclick="removeGroup(\''+front+'\',\''+g.id+'\')">Excluir grupo</button></div>').join("")+'</div><button onclick="addGroup(\''+front+'\')">+ Grupo</button>','saveGroups(\''+front+'\')')}
function addGroup(front){const q=project();q.groups[front].push({id:front.toUpperCase().slice(0,3)+"-G"+Date.now(),name:"Novo grupo",order:q.groups[front].length+1});closeModal();manageGroups(front)}
function removeGroup(front,gid){const q=project();if(!confirm("Excluir este agrupamento? Os registros permanecerão e ficarão sem grupo."))return;q.groups[front]=q.groups[front].filter(g=>g.id!==gid);const map={budget:"budgetItems",planning:"activities",supplies:"supplies",sources:"sources",suppliers:"suppliers"};q[map[front]].forEach(x=>{if(x.groupId===gid)x.groupId=""});closeModal();manageGroups(front)}
function saveGroups(front){const q=project();q.groups[front].forEach((g,i)=>{const n=document.getElementById("gName"+i),o=document.getElementById("gOrder"+i);if(n)g.name=n.value;if(o)g.order=Number(o.value)});closeModal();persist("Agrupamentos de "+front+" atualizados")}

function deleteRecord(arrName,recId,label){if(!confirm("Excluir "+label+" "+recId+"?"))return;const q=project();q[arrName]=q[arrName].filter(x=>x.id!==recId);if(arrName==="budgetItems"){q.quotes=q.quotes.filter(x=>x.budgetItemId!==recId);q.supplies.forEach(s=>{if(s.budgetItemId===recId)s.budgetItemId=""})}persist(label+" excluído: "+recId)}
function addComment(){const v=commentBox.value.trim();if(!v)return;project().comments.unshift(new Date().toLocaleString("pt-BR")+" — "+session.user+": "+v);persist("Comentário registrado")}
function userForm(){openModal("Novo usuário",'<div class="formgrid">'+field("fUser","Usuário","")+field("fPass","Senha","","password")+selectField("fRole","Perfil",[["editor","Projetista/Editor"],["viewer","Visualizador"],["master","Master"]],"editor")+'</div>','saveUser()')}
function saveUser(){if(!fUser.value.trim()||!fPass.value)return alert("Informe usuário e senha.");db.users.push({user:fUser.value.trim(),pass:fPass.value,role:fRole.value});closeModal();persist("Usuário criado")}
function projectForm(){openModal("Novo projeto",'<div class="formgrid">'+field("fName","Nome","Novo projeto","text","full")+field("fLoc","Local","Brasília/DF")+'</div>','saveProject()')}
function saveProject(){const q=deep(model);q.id="p-"+Date.now();q.name=fName.value.trim()||"Novo projeto";q.location=fLoc.value.trim()||"Brasília/DF";q.owner=session.user;q.audit=["Projeto criado a partir do modelo v"+VERSION+"."];db.projects.push(q);db.current=q.id;closeModal();persist("Projeto criado")}
function exportJSON(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(project(),null,2)],{type:"application/json"}));a.download=project().id+"-itcc-v040.json";a.click()}
function importJSON(){const f=importFile.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const q=JSON.parse(r.result);if(!q.id||!q.zones)throw 0;q.budgetItems=q.budgetItems||[];q.activities=q.activities||[];q.supplies=q.supplies||[];q.sources=q.sources||[];q.suppliers=q.suppliers||[];q.quotes=q.quotes||[];q.groups=q.groups||deep(model.groups);db.projects.push(q);db.current=q.id;persist("Projeto importado")}catch(e){alert("JSON incompatível.")}};r.readAsText(f)}
function exportCSV(front){const q=project();let rows=[];if(front==="budget")rows=[["id","grupo","classe","codigo","descricao","quantidade","unidade","preco_unitario","fonte","fornecedor","total"],...q.budgetItems.map(x=>[x.id,groupName("budget",x.groupId),x.kind,x.code,x.name,x.qty,x.unit,x.unitPrice,sourceName(x.sourceId),supplierName(x.supplierId),x.qty*x.unitPrice])];if(front==="planning")rows=[["id","grupo","atividade","zona","predecessora","dias","equipe","lead","status"],...q.activities.map(x=>[x.id,groupName("planning",x.groupId),x.name,x.zone,x.pred,x.days,x.crew,x.lead,x.status])];if(front==="supplies")rows=[["id","grupo","suprimento","item_orcamento","quantidade","unidade","seguranca_pct","lead","fornecedor","status"],...q.supplies.map(x=>[x.id,groupName("supplies",x.groupId),x.name,x.budgetItemId,x.qty,x.unit,x.safety,x.lead,supplierName(x.supplierId),x.status])];if(front==="sources")rows=[["id","grupo","tipo","nome","regiao","data","url","nota"],...q.sources.map(x=>[x.id,groupName("sources",x.groupId),x.type,x.name,x.region,x.date,x.url,x.note])];if(front==="suppliers")rows=[["id","grupo","fornecedor","cnpj","cidade","endereco","telefone","url","categorias","status"],...q.suppliers.map(x=>[x.id,groupName("suppliers",x.groupId),x.name,x.cnpj,x.city,x.address,x.phone,x.url,x.categories,x.status])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=project().id+"-"+front+"-v040.csv";a.click()}

localStorage.setItem(KEY,JSON.stringify(db));applyTheme();
